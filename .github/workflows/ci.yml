name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Every (PHP, PHPUnit major) combination the composer constraint
    # allows must be proven here. A single composer.lock cannot express
    # multiple PHPUnit majors, so each cell runs `composer update` with
    # a temporary constraint pin instead of `composer install`.
    # Impossible pairs (PHPUnit 12 needs PHP >= 8.3, PHPUnit 13 needs
    # PHP >= 8.4) are omitted.
    name: PHPUnit ${{ matrix.phpunit }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            phpunit: '^11.5'
          - php: '8.3'
            phpunit: '^11.5'
          - php: '8.3'
            phpunit: '^12.0'
          - php: '8.4'
            phpunit: '^11.5'
          - php: '8.4'
            phpunit: '^12.0'
          - php: '8.4'
            phpunit: '^13.0'
    steps:
      - name: Checkout
        # v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up PHP
        # v2
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Install dependencies (PHPUnit ${{ matrix.phpunit }})
        run: composer update --no-interaction --no-progress --with "phpunit/phpunit:${{ matrix.phpunit }}"

      - name: Run test suite
        run: vendor/bin/phpunit --no-progress
